[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = -q --cov=app --cov-branch --cov-fail-under=60 --ignore=ressources/veloville/tests/unit/test_fiabilisation.py


[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
